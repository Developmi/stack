---
# ==============================================================================
# Developmi Stack | L6 Runtime Backup - Timers
# ==============================================================================
# BACKUP TIMER AUTOMATION - systemd scheduling layer
# ==============================================================================
# Purpose: Deploy systemd .timer + .service units for database dumps and
#          Docker volume backups at Tier-defined RPO intervals.
#          Scheduling layer only - backup execution is handled by
#          roles/L6_runtime/backup (app-data mode).
#          NIST SP 800-53 CP-9 and CM-6.
# ==============================================================================
# Usage:
#   ansible-playbook -i inventory/hosts.ini playbooks/l6/backup-timers.yml
#   ansible-playbook -i inventory/hosts.ini playbooks/l6/backup-timers.yml --limit brain-1
# ==============================================================================

- name: "Deploy systemd Backup Timers"
  hosts: all
  become: true
  tags: [l6-runtime, backup-timers]
  vars:
    backup_role_source: timers
  pre_tasks:
    - name: "Preflight: Require overlay-network ansible_host"
      ansible.builtin.include_tasks: ../_shared/overlay_preflight.yml
      tags: [l6-runtime, backup-timers]
  roles:
    - role: L6_runtime/backup
