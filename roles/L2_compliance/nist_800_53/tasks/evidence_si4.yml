---
# -----------------------------------------------------------------
# NIST Evidence Collection - opt-in via l2_compliance_enabled: true
# Set in inventory/group_vars/ or pass -e l2_compliance_enabled=true
# Evidence output: /srv/evidence/nist/<control-id>/
# -----------------------------------------------------------------
# ==============================================================================
# COMPLIANCE - Evidence Collection: SI-4 (System Monitoring)
# ==============================================================================
# Collects: CrowdSec alert summary, auditd active rules.
# Output: /srv/evidence/nist/si-4/
# Read-only - no services restarted, no configs modified.
# ==============================================================================

- name: "SI-4 | Ensure evidence directory exists"
  ansible.builtin.file:
    path: /srv/evidence/nist/si-4
    state: directory
    mode: "0755"
  tags: [compliance, l2-compliance, nist, si-4]

- name: "SI-4 | Collect CrowdSec alert summary"
  ansible.builtin.command: cscli alerts list -o raw
  register: _si4_cs
  changed_when: false
  failed_when: false
  tags: [compliance, l2-compliance, nist, si-4]

- name: "SI-4 | Write CrowdSec alerts evidence"
  ansible.builtin.copy:
    dest: /srv/evidence/nist/si-4/crowdsec_alerts
    content: "{{ _si4_cs.stdout | default('CrowdSec not installed or no alerts') }}"
    mode: "0640"
  tags: [compliance, l2-compliance, nist, si-4]

- name: "SI-4 | Collect auditd active rules"
  ansible.builtin.command: auditctl -l
  register: _si4_auditd
  changed_when: false
  failed_when: false
  tags: [compliance, l2-compliance, nist, si-4]

- name: "SI-4 | Write auditd rules evidence"
  ansible.builtin.copy:
    dest: /srv/evidence/nist/si-4/auditd_rules
    content: "{{ _si4_auditd.stdout | default('auditd not installed') }}"
    mode: "0640"
  tags: [compliance, l2-compliance, nist, si-4]
