---
# ==============================================================================
# DEPLOY SSH PUBLIC KEYS - From Vault (NIST IA-5)
# ==============================================================================
# Reads public keys from vault-encrypted ssh_public_keys dict.
# Creates ~/.ssh directories with 0700, authorized_keys with 0600.
# Uses exclusive: false to preserve any other manually-added keys.
# ==============================================================================

- name: "IA-5 | Assert SSH public keys exist in vault"
  ansible.builtin.assert:
    that:
      - ssh_public_keys is defined
      - ssh_public_keys.dev_admin is defined
      - ssh_public_keys.dev_admin | length > 0
      - ssh_public_keys.automation is defined
      - ssh_public_keys.automation | length > 0
      - ssh_public_keys.breakglass is defined
      - ssh_public_keys.breakglass | length > 0
    fail_msg: >
      ssh_public_keys dict is missing or incomplete in group_vars/all/secrets.yml.
      All three keys (dev_admin, automation, breakglass) are required.
      Run: ansible-vault edit group_vars/all/secrets.yml
    success_msg: "✅ SSH public keys validated for all 3 users"

- name: "IA-5 | Create ~/.ssh directories"
  ansible.builtin.file:
    path: "{{ item.home }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0700"
  loop: "{{ user_hardening_users }}"
  tags: [users, l2-compliance, nist, ia-5]

- name: "IA-5 | Deploy authorized_keys"
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    key: "{{ ssh_public_keys[item.username] }}"
    state: present
    exclusive: false
    manage_dir: false
  loop: "{{ user_hardening_users }}"
  tags: [users, l2-compliance, nist, ia-5]
