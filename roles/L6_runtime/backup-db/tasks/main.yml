---
# backup-db tasks - idempotent install → deploy pipeline

# ── Phase 0: Pre-requisites ──

- name: "Ensure bzip2 is installed (needed for restic archive decompression)"
  ansible.builtin.package:
    name: bzip2
    state: present
  tags: [l6-runtime, backup-db]

# ── Phase 1: Restic Installation ──

- name: "Validate Docker daemon is accessible"
  ansible.builtin.command: docker info
  changed_when: false
  tags: [l6-runtime, backup-db, backup]

- name: "Check restic binary exists"
  ansible.builtin.stat:
    path: "{{ restic_install_path }}"
  register: restic_binary
  tags: [l6-runtime, backup-db, backup]

- name: "Get installed restic version"
  ansible.builtin.command: "{{ restic_install_path }} version"
  register: restic_version_installed
  changed_when: false
  when: restic_binary.stat.exists
  tags: [l6-runtime, backup-db, backup]

- name: "Download restic archive"
  ansible.builtin.get_url:
    url: "{{ restic_download_url }}"
    dest: "{{ restic_download_dir }}/restic.bz2"
    mode: "0644"
  when: >-
    not restic_binary.stat.exists
    or restic_version not in restic_version_installed.stdout
    or restic_version_installed.stdout | regex_search('restic (\d+\.\d+\.\d+)', '\1') | first != restic_version
  tags: [l6-runtime, backup-db, backup]

- name: "Verify SHA256 checksum"
  ansible.builtin.shell:
    cmd: echo "{{ sha256_lookup }} {{ restic_download_dir }}/restic.bz2" | sha256sum -c
  vars:
    sha256_lookup: >-
      {{ restic_sha256_linux_amd64 if restic_arch == 'amd64' else restic_sha256_linux_arm64 }}
  changed_when: false
  when: >-
    not restic_binary.stat.exists
    or restic_version not in restic_version_installed.stdout
    or restic_version_installed.stdout | regex_search('restic (\d+\.\d+\.\d+)', '\1') | first != restic_version
  tags: [l6-runtime, backup-db, backup]

- name: "Decompress and install restic binary"
  ansible.builtin.shell:
    cmd: >-
      bunzip2 -c {{ restic_download_dir }}/restic.bz2 > {{ restic_install_path }}
      && chmod 0755 {{ restic_install_path }}
  when: >-
    not restic_binary.stat.exists
    or restic_version not in restic_version_installed.stdout
    or restic_version_installed.stdout | regex_search('restic (\d+\.\d+\.\d+)', '\1') | first != restic_version
  tags: [l6-runtime, backup-db, backup]

- name: "Remove temporary restic archive"
  ansible.builtin.file:
    path: "{{ restic_download_dir }}/restic.bz2"
    state: absent
  tags: [l6-runtime, backup-db, backup]

# ── Phase 2: Env File Validation ──

- name: "Assert restic env file exists"
  ansible.builtin.stat:
    path: "{{ restic_env_file }}"
  register: restic_env_stat
  tags: [l6-runtime, backup-db, backup]

- name: "Fail if restic env file missing"
  ansible.builtin.fail:
    msg: >-
      Restic env file {{ restic_env_file }} not found.
      Deploy backup-stack role first.
  when: not restic_env_stat.stat.exists
  tags: [l6-runtime, backup-db, backup]

# ── Phase 3: Backup Script ──

- name: "Deploy backup-databases.sh"
  ansible.builtin.template:
    src: backup-databases.sh.j2
    dest: "{{ backup_script_path }}"
    mode: "0755"
  tags: [l6-runtime, backup-db, backup]

# ── Phase 4: Systemd Units ──

- name: "Deploy backup-databases.service"
  ansible.builtin.template:
    src: backup-databases.service.j2
    dest: /etc/systemd/system/backup-databases.service
  notify: Reload systemd
  tags: [l6-runtime, backup-db, backup]

- name: "Deploy backup-databases.timer"
  ansible.builtin.template:
    src: backup-databases.timer.j2
    dest: /etc/systemd/system/backup-databases.timer
  notify: Reload systemd
  tags: [l6-runtime, backup-db, backup]

- name: "Enable and start backup-databases.timer"
  ansible.builtin.systemd:
    name: backup-databases.timer
    enabled: true
    state: started
  tags: [l6-runtime, backup-db, backup]
