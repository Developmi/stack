---
# Sub-task: render the unified engine unit pair for one app profile.
# Included by engine.yml over the controller-side profile scan.
#
# App identity comes from the profile DIRECTORY (apps/<app>/profile.yml ->
# <app>), never from a `name` field (BPI-001). The reduced schema dropped
# `name`; a stale `name` must NOT be used. `db_type: none|custom` apps deploy no
# unit and raise no error (BPI-003). The derived name is asserted against
# ^[a-z0-9_-]+$ before ANY template render (doc-like-path threat).

- name: "Load profile variables"
  ansible.builtin.include_vars:
    file: "{{ item }}"
    name: _p
  tags: [l6-runtime, backup, backup_engine]

- name: "Derive app name from profile path"
  ansible.builtin.set_fact:
    _app_name: "{{ item | dirname | basename }}"
  when: enable_backups | default(false) | bool
  tags: [l6-runtime, backup, backup_engine]

- name: "Validate derived app name (systemd unit safety)"
  ansible.builtin.assert:
    that:
      - _app_name is match('^[a-z0-9_-]+$')
    fail_msg: >-
      Invalid app name '{{ _app_name }}' derived from profile path
      '{{ item }}'. App directory names must match ^[a-z0-9_-]+$
      (systemd unit-name safety).
    quiet: true
  when: enable_backups | default(false) | bool
  tags: [l6-runtime, backup, backup_engine]
  # Threat matrix: shell metacharacters in profile paths are rejected before
  # any template render (ExecStart interpolation), so no unit is written.

- name: "Validate declared volumes[] entries (APP-PROFILE-SCHEMA-004-04/-05)"
  ansible.builtin.assert:
    that:
      - _vol.name is defined
      - _vol.mount_path is defined
      - _vol.consistency is defined
      - _vol.consistency in ['quiesce', 'live']
    fail_msg: >-
      Invalid backup.volumes[] entry in profile '{{ _app_name }}': `name`,
      `mount_path` and `consistency` are required, and `consistency` MUST be one
      of 'quiesce' or 'live' (got
      '{{ _vol.consistency | default("<missing>") }}'). See
      APP-PROFILE-SCHEMA-004-04/-05.
    quiet: true
  loop: "{{ _p.backup.volumes | default([]) }}"
  loop_control:
    loop_var: _vol
    label: "{{ _vol.name | default(_vol.mount_path) | default('volume') }}"
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
  tags: [l6-runtime, backup, backup_engine]
  # Only `quiesce` and `live` are accepted (APP-PROFILE-SCHEMA-004-05). The
  # assert runs before any template render, so an invalid profile writes no unit.

- name: "Resolve container/volume identity at runtime (D5)"
  ansible.builtin.include_tasks: resolve.yml
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - _p.backup.db_type | default('') not in ['none', 'custom']
  tags: [l6-runtime, backup, backup_engine]

- name: "Render per-app DB credential EnvironmentFile (D8/CRED-001..004)"
  ansible.builtin.include_tasks: db_credentials.yml
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - (_p.backup.method | default(_p.backup.db_type)) in ['pg_dump', 'postgres', 'mysqldump', 'mysql']
  tags: [l6-runtime, backup, backup_engine, backup_creds]

- name: "Deploy backup-engine-{{ _app_name }}.sh"
  ansible.builtin.template:
    src: backup-engine.sh.j2
    dest: "/usr/local/bin/backup-engine-{{ _app_name }}.sh"
    mode: "0755"
    owner: root
    group: root
  # skip none/custom - these apps have no engine-dumpable DB/volume
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - _p.backup.db_type | default('') not in ['none', 'custom']
  tags: [l6-runtime, backup, backup_engine]

- name: "Deploy backup-engine-{{ _app_name }}.service"
  ansible.builtin.template:
    src: backup-engine.service.j2
    dest: "/etc/systemd/system/backup-engine-{{ _app_name }}.service"
    mode: "0644"
  notify: reload systemd
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - _p.backup.db_type | default('') not in ['none', 'custom']
  tags: [l6-runtime, backup, backup_engine]

- name: "Deploy backup-engine-{{ _app_name }}.timer"
  ansible.builtin.template:
    src: backup-engine.timer.j2
    dest: "/etc/systemd/system/backup-engine-{{ _app_name }}.timer"
    mode: "0644"
  notify: reload systemd
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - _p.backup.db_type | default('') not in ['none', 'custom']
  tags: [l6-runtime, backup, backup_engine]

- name: "Enable and start backup-engine-{{ _app_name }}.timer"
  ansible.builtin.systemd:
    name: "backup-engine-{{ _app_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - enable_backups | default(false) | bool
    - _p.backup is defined
    - _p.backup.db_type | default('') not in ['none', 'custom']
  tags: [l6-runtime, backup, backup_engine]
