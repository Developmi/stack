# ---
# COMPLIANCE WARNING:
# Credential files contain R2 API keys and Restic encryption passwords.
# Deployed with no_log: true to prevent secret leakage in Ansible output.
# File permissions: /etc/restic/env (0600), /etc/restic/password.key (0400).
# ---
---
- name: "Ensure /etc/restic directory exists"
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"
    owner: root
    group: root
  tags: [l6-runtime, stack_backup, restic]

- name: "Deploy Restic password file (used via RESTIC_PASSWORD_FILE env var)"
  ansible.builtin.copy:
    dest: /etc/restic/password.key
    content: "{{ lookup('vars', 'restic_password_' ~ ansible_hostname | replace('-', '_')) }}"
    mode: "0400"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, stack_backup, restic]

- name: "Deploy Restic environment file"
  ansible.builtin.template:
    src: restic-env.j2
    dest: /etc/restic/env
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, stack_backup, restic]

- name: "Deploy credential-free EnvironmentFile for ephemeral restic runs (CRED-005)"
  ansible.builtin.template:
    src: restic-run-env.j2
    dest: "{{ restic_run_env_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, stack_backup, restic]

- name: "Deploy credential-free EnvironmentFile for retention (CRED-005, D2)"
  ansible.builtin.template:
    src: restic-retention-env.j2
    dest: "{{ restic_retention_env_file }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, stack_backup, restic]

- name: "Ensure Restic cache directory exists"
  ansible.builtin.file:
    path: /var/cache/restic
    state: directory
    mode: "0700"
    owner: root
    group: root
  tags: [l6-runtime, stack_backup, restic]

- name: "Deploy emergency recovery password file (~root/.restic-key)"
  ansible.builtin.copy:
    dest: /root/.restic-key
    content: "{{ lookup('vars', 'restic_password_' ~ ansible_hostname | replace('-', '_')) }}\n"
    mode: "0400"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, stack_backup, restic]
