# ---
# COMPLIANCE WARNING:
# The local filesystem repository is the D1 second medium for the APP-DATA repo
# `restic/<inventory_hostname>` (STORAGE-006). It is initialized with the SOURCE
# chunker parameters so deduplication works across both repositories, then
# seeded once via `restic copy`. Subsequent runs are no-ops via the marker file
# /etc/restic/.local-seed-complete. No secret is ever logged (no_log: true).
#
# HOST KEY (design D4 / open Q1): the password key is
# `restic_password_<inventory_hostname>`. When ansible_hostname diverges from
# inventory_hostname the app-data repo path (keyed by inventory_hostname) may be
# empty, so the seed falls back to the pre-migration stack-config repo
# `stack-restic/<ansible_hostname>` (restic_repo_url). The divergence is recorded
# as a warning; see docs/operations/BACKUP_MIGRATION_RUNBOOK.md §Gate 2.
#
# SOURCE PROBE (read-only): `restic cat config` runs before any mutation. When
# the source repository is absent/unreachable - e.g. a host that does not run
# apps - the seed is SKIPPED without failing the play and WITHOUT writing the
# marker, so a later deploy retries. A live local repository is never
# re-initialized (NO-RE-INIT contract, design D4): the local `restic init` is
# guarded by the existence of <local>/config.
# ---
---
# ── Host-key resolution guard (design D4 / open Q1 / task 6.4) ──
# After the L1 baseline role runs, `ansible_hostname == inventory_hostname` on
# brain-1/muscle-1 (roles/L1_os_baseline/general/tasks/hostname.yml sets the
# kernel hostname from inventory_hostname). This guard makes the assumption
# EXPLICIT and DEFENSIVE: it never fails a migration run, but when the two
# diverge the local seed copies from the pre-migration stack-config repo
# `stack-restic/<ansible_hostname>` (restic_repo_url) instead of the app-data
# repo, because the app-data repo path is keyed by inventory_hostname and would
# be empty on a divergent host. Recorded as a warning so an operator sees it.
- name: "Resolve ansible_hostname vs inventory_hostname (D4 / open Q1)"
  ansible.builtin.set_fact:
    _repo_init_host_key_divergent: "{{ ansible_hostname != inventory_hostname }}"
    _repo_init_copy_source: >-
      {{ restic_repo_url if (ansible_hostname != inventory_hostname)
         else restic_appdata_repo_url }}
  tags: [l6-runtime, restic, restic_local]

- name: "Report the migration copy source (D4 / open Q1)"
  ansible.builtin.debug:
    msg: >-
      repo-init-local[{{ inventory_hostname }}]: ansible_hostname={{ ansible_hostname }},
      inventory_hostname={{ inventory_hostname }},
      divergent={{ _repo_init_host_key_divergent }}; local second medium seeds
      from {{ _repo_init_copy_source }}.
  tags: [l6-runtime, restic, restic_local]

- name: "Warn when host keys diverge - copy falls back to the stack-config repo (open Q1)"
  ansible.builtin.debug:
    msg: >-
      WARNING: ansible_hostname ({{ ansible_hostname }}) != inventory_hostname
      ({{ inventory_hostname }}). The app-data repo restic/<inventory_hostname>
      is keyed by inventory_hostname and may be empty on this host, so the local
      seed copies from the pre-migration stack-config repo
      stack-restic/<ansible_hostname>. Confirm the resolved URL before relying on
      the local copy. See docs/operations/BACKUP_MIGRATION_RUNBOOK.md §Gate 2.
  when: _repo_init_host_key_divergent | bool
  tags: [l6-runtime, restic, restic_local]

# ── Second medium: local FS repository seeded from R2 (D1/STORAGE-006) ──
# The local repo is the second medium for the APP-DATA repo `restic/<host>`
# (design D1). It is initialized with the SOURCE chunker parameters so that
# deduplication works across both repositories, then seeded once via
# `restic copy`. Subsequent runs are no-ops (marker file).

# Read-only source-repo availability probe. When the source repo is absent or
# unreachable (e.g. a host that does not run apps), the whole seed is skipped
# below and no marker is written, so a later deploy retries.
- name: "Local seed | Probe the source repository read-only (D1)"  # noqa: command-instead-of-module
  ansible.builtin.command: >
    restic cat config
    --repo "{{ _repo_init_copy_source }}"
  environment:
    RESTIC_PASSWORD: "{{ lookup('vars', 'restic_password_' ~ inventory_hostname | replace('-', '_')) }}"
    AWS_ACCESS_KEY_ID: "{{ restic_r2_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_r2_secret_access_key }}"
    AWS_DEFAULT_REGION: "auto"
  register: _local_seed_source_probe
  changed_when: false
  failed_when: false
  no_log: true
  tags: [l6-runtime, restic, restic_local]

- name: "Local seed | Record whether the source repository is reachable (D1)"
  ansible.builtin.set_fact:
    _local_seed_source_available: "{{ (_local_seed_source_probe.rc | default(1)) == 0 }}"
  tags: [l6-runtime, restic, restic_local]

- name: "Local seed | Skip the local second medium when the source is unavailable (D1)"
  ansible.builtin.debug:
    msg: >-
      repo-init-local[{{ inventory_hostname }}]: source repository
      {{ _repo_init_copy_source }} is not reachable (probe rc={{
      _local_seed_source_probe.rc | default('?') }}). The local second medium
      seed is skipped and will retry on the next deploy; the seed marker is left
      untouched.
  when: not (_local_seed_source_available | bool)
  tags: [l6-runtime, restic, restic_local]

- name: "Check if local Restic repository is initialized"
  ansible.builtin.stat:
    path: "{{ restic_local_repo_path }}/config"
  register: local_repo_config
  tags: [l6-runtime, restic, restic_local]

- name: "Ensure local Restic repository directory exists"
  ansible.builtin.file:
    path: "{{ restic_local_repo_path }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  when: _local_seed_source_available | bool
  tags: [l6-runtime, restic, restic_local]

- name: "Initialize local Restic repository with source chunker params (D1)"  # noqa: command-instead-of-module
  ansible.builtin.command: >
    restic init
    --repo "{{ restic_local_repo_path }}"
    --password-file /etc/restic/password.key
    --from-repo "{{ _repo_init_copy_source }}"
    --from-password-file /etc/restic/password.key
    --copy-chunker-params
  environment:
    AWS_ACCESS_KEY_ID: "{{ restic_r2_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_r2_secret_access_key }}"
    AWS_DEFAULT_REGION: "auto"
  when:
    - _local_seed_source_available | bool
    - not local_repo_config.stat.exists
  changed_when: true
  no_log: true
  tags: [l6-runtime, restic, restic_local]

- name: "Check local repository seed marker"
  ansible.builtin.stat:
    path: /etc/restic/.local-seed-complete
  register: local_seed_marker
  tags: [l6-runtime, restic, restic_local]

- name: "Seed local repository from R2 via restic copy (D1)"  # noqa: command-instead-of-module
  ansible.builtin.command: >
    restic copy
    --repo "{{ restic_local_repo_path }}"
    --password-file /etc/restic/password.key
    --from-repo "{{ _repo_init_copy_source }}"
    --from-password-file /etc/restic/password.key
  environment:
    AWS_ACCESS_KEY_ID: "{{ restic_r2_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ restic_r2_secret_access_key }}"
    AWS_DEFAULT_REGION: "auto"
  when:
    - _local_seed_source_available | bool
    - not local_seed_marker.stat.exists
  changed_when: true
  no_log: true
  tags: [l6-runtime, restic, restic_local]

- name: "Mark local repository seed complete"
  ansible.builtin.file:
    path: /etc/restic/.local-seed-complete
    state: touch
    mode: "0600"
    owner: root
    group: root
  when:
    - _local_seed_source_available | bool
    - not local_seed_marker.stat.exists
  tags: [l6-runtime, restic, restic_local]
