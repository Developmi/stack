---
# =============================================================================
# Unified backup engine - per-app DB credential EnvironmentFile (D8/CRED-001..004)
# =============================================================================
# The profile declares intent only (`db_name`, `user`); it MUST NOT carry a
# password (CRED-001). The password lives in SOPS as
# `backup_db_<app>_password` and is rendered here into a root-owned 0600 file
# `/etc/restic/db-<app>.env` consumed as PGPASSWORD (PostgreSQL) or MYSQL_PWD
# (MySQL). It is NEVER passed as a command-line argument and is NEVER read from
# `docker inspect` or container environment (CRED-003/004).
#
# Included from deploy_from_profile.yml, so `_p` and `_app_name` are in scope.
# =============================================================================

- name: "DB creds | Determine the credential env var (CRED-003)"
  ansible.builtin.set_fact:
    _db_cred_env_var: >-
      {{ 'PGPASSWORD'
         if (_p.backup.method | default(_p.backup.db_type)) in ['pg_dump', 'postgres']
         else 'MYSQL_PWD' }}
    _db_cred_key: "backup_db_{{ _app_name | replace('-', '_') }}_password"
  tags: [l6-runtime, backup, backup_engine, backup_creds]

- name: "DB creds | Assert the SOPS password is present and non-empty (CRED-001/002)"
  ansible.builtin.assert:
    that:
      - lookup('vars', _db_cred_key, default='') | length > 0
    fail_msg: >-
      {{ _db_cred_key }} is missing or empty. Add it to the SOPS file
      inventory/group_vars/all/secrets.sops.yml (make sops-edit). The engine
      refuses to dump unauthenticated (CRED-001/002).
    success_msg: "SOPS credential {{ _db_cred_key }} is present"
    quiet: true
  tags: [l6-runtime, backup, backup_engine, backup_creds]

- name: "DB creds | Render the per-app DB environment file (0600 root, CRED-003)"
  ansible.builtin.copy:
    dest: "/etc/restic/db-{{ _app_name }}.env"
    content: "{{ _db_cred_env_var }}={{ lookup('vars', _db_cred_key) }}\n"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags: [l6-runtime, backup, backup_engine, backup_creds]
