---
# L6 Runtime Backup - Consolidated dispatcher
# Source selector via backup_role_source variable:
#   "stack" (default) - host-level stack backups (Restic → R2 stack-restic/)
#   "engine"          - unified profile-declarative backup engine (all apps)
# The legacy "app-data" and "timers" paths were retired with the unified engine
# (ENGINE-001): their task files and templates are gone, so only the two values
# above are valid. Tags preserved for backward compatibility.

# Credentials and /etc/restic/env are provisioned for EVERY backup host,
# regardless of the source path (D7/STORAGE-003). Previously this only ran in
# the stack path, which left muscle-class hosts without /etc/restic/env.
- name: "Include credential and environment file deployment (all backup hosts, D7)"
  ansible.builtin.include_tasks: credentials.yml
  tags: [l6-runtime, stack_backup, restic, restic_creds]
  when: enable_backups | default(false) | bool

- name: "Include stack backup tasks"
  ansible.builtin.include_tasks: stack_backup.yml
  tags: [l6-runtime, stack_backup, restic]
  when: backup_role_source is not defined or backup_role_source == "stack"

- name: "Include unified engine tasks (D11/ENGINE-001)"
  ansible.builtin.include_tasks: engine.yml
  tags: [l6-runtime, backup, backup_engine]
  when: backup_role_source is defined and backup_role_source == "engine"
