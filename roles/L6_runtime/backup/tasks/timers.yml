---
# =============================================================================
# Orchestrator: backup-timers role main.yml
# =============================================================================
# Source of truth: app profiles on disk (apps/*/profile.yml) per ADR-03.
# Flow: fileglob scan → include_vars each profile → deploy DB timer when
#       profile.backup is defined → flush handlers → enable+start timers.
# Independent: no dependency on apps.yml or runtime facts.
# =============================================================================

# NOTE: backup_r2_account_id is stored directly in vault (shared with restic role, no vault_ prefix),
#       while access/secret keys use vault_ prefix → defaults-level Jinja indirection.
#       This split convention is intentional - do not "normalize" the names.
- name: "Validate R2 vault vars are defined"
  ansible.builtin.assert:
    that:
      - backup_r2_account_id | default('') | length > 0
      - vault_backup_r2_access_key_id | default('') | length > 0
      - vault_backup_r2_secret_access_key | default('') | length > 0
    fail_msg: |
      One or more R2 backup vault variables are missing or empty.
      Run: ansible-vault edit inventory/group_vars/all/secrets.yml
      Required vars (documented in secrets.yml.example):
        backup_r2_account_id, vault_backup_r2_access_key_id, vault_backup_r2_secret_access_key
    quiet: true
  when: enable_backups | default(false) | bool
  tags: [l6-runtime, backup_timers]

- name: "Process each app profile for backup timers"
  ansible.builtin.include_tasks: deploy_from_profile.yml
  with_fileglob:
    - "{{ inventory_dir }}/../../apps/*/profile.yml"
  tags: [l6-runtime, backup_timers]

- name: "Flush handlers (systemd daemon-reload)"
  ansible.builtin.meta: flush_handlers
  tags: [l6-runtime, backup_timers]
