---
# =============================================================================
# Orchestrator: backup-timers role main.yml
# =============================================================================
# Source of truth: app profiles on disk (apps/*/profile.yml) per ADR-03.
# Flow: find scan (controller side) → include_vars each profile → deploy DB
#       timer when profile.backup is defined → flush handlers → enable+start.
# Independent: no dependency on apps.yml or runtime facts.
#
# NOTE: with_fileglob cannot express `apps/*/profile.yml` under
# ansible-core 2.21.1. The fileglob lookup splits the term into dir+basename
# and resolves the dir part via the search path, so a wildcard in the
# directory segment matches nothing. The find module on the controller is
# used instead - app profiles live on the controller, not on managed hosts.
# The find module runs via lookup('ansible.builtin.pipe') so the scan stays
# on the control node WITHOUT delegate_to + task-level become: false (an
# ansible_become var wins over task keywords, see ansible.cfg
# [privilege_escalation]). This mirrors the immune pipe-lookup pattern used
# by the overlay preflight in playbooks/l6/backup-timers.yml.
# =============================================================================

# NOTE: backup_r2_account_id is stored directly in the SOPS file (shared with restic role, no vault_ prefix),
#       while access/secret keys use vault_ prefix → defaults-level Jinja indirection.
#       This split convention is intentional - do not "normalize" the names.
- name: "Validate R2 backup secret vars are defined"
  ansible.builtin.assert:
    that:
      - backup_r2_account_id | default('') | length > 0
      - vault_backup_r2_access_key_id | default('') | length > 0
      - vault_backup_r2_secret_access_key | default('') | length > 0
    fail_msg: |
      One or more R2 backup secret variables are missing or empty.
      Run: make sops-edit
      Required vars (documented in secrets.sops.yml.example):
        backup_r2_account_id, vault_backup_r2_access_key_id, vault_backup_r2_secret_access_key
    quiet: true
  when: enable_backups | default(false) | bool
  tags: [l6-runtime, backup-timers]

- name: "Collect app profile files (controller side)"
  ansible.builtin.set_fact:
    _app_profile_paths: >-
      {{ lookup('ansible.builtin.pipe',
           'find ' ~ (inventory_dir + '/../apps') | quote ~ ' -name profile.yml -type f')
         | split('\n') | select('length') | list | sort }}
  tags: [l6-runtime, backup-timers]

- name: "Process each app profile for backup timers"
  ansible.builtin.include_tasks: deploy_from_profile.yml
  loop: "{{ _app_profile_paths }}"
  tags: [l6-runtime, backup-timers]

- name: "Flush handlers (systemd daemon-reload)"
  ansible.builtin.meta: flush_handlers
  tags: [l6-runtime, backup-timers]
