---
# =============================================================================
# MUSCLE SERVERS - MAIN CONFIGURATION
# =============================================================================
# Variables generales para servidores muscle (workers)
# =============================================================================

# Server role identification
server_role: muscle
server_type: worker
host_class: muscle
cloud_provider: oci

# L1-L2 hardening profile - server-grade (strict fail2ban, CrowdSec enforcement)
hardening_profile: server

# Worker-specific settings
worker_enable_autoscaling: false # For future use
worker_max_containers: 50 # For future monitoring

# Observability
# Muscle does not host the monitoring UI stack, but should export metrics to brain.
enable_observability_stack: false
enable_metrics_exporters: true
monitoring_port: 9100

# Backup configuration
enable_backups: false # Workers are stateless - Restic is brain-only
