---
# =============================================================================
# Caddy Node Configuration - ALL brain nodes (management)
# =============================================================================
# Group-level defaults for the Caddy ingress reverse proxy.
# Automatically inherited by every node in the [brain] inventory group.
# Add a new brain node to inventory → zero additional files needed.
# Consumed by roles/L4_networking/caddy (Caddyfile.j2, tasks/main.yml).
# =============================================================================

# Node type classification: brain (management) or muscle (worker).
# Used for preflight validation - ensures node is in a recognized group.
caddy_type: "brain"

# --- Admin API ---
# NIST AC-3 / IA-2 | Disabled in production (default).
# Contract M1 (§6): enable ONLY when the caddy-waf-ui is deployed. When enabled,
# Caddyfile renders `admin 0.0.0.0:2019 { enforce_origin }` — container-network
# binding so the UI (caddy-waf:2019) and VictoriaMetrics reach it; port 2019 is
# NEVER published to the host (compose publishes 80/443 only; L2 firewall also
# denies 2019 on tailscale0). mTLS (identity + client certs) is the §6 target.
caddy_admin_enabled: false

# --- WAF (Coraza) Enforcement Mode ---
# WAF mode is per SERVICE, defined in the SOPS routing catalog
# (ingress_services[].waf_mode / waf_mode_default) and rendered by
# roles/L4_networking/caddy/templates/Caddyfile.j2 (route /waf*).
# There is NO per-host WAF variable - the legacy caddy_coraza_mode was removed
# because nothing consumed it.
