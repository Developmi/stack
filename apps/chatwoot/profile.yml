---
# Chatwoot - Customer support platform (L5)
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/"
  health_port: 3000
  scrape_port: 3000

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier1

backup:
  method: pg_dump
  schedule: "*-*-* 00/4:00:00"
  retention_daily: 7
  retention_weekly: 4
  retention_monthly: 12
  verification: monthly-restore-test
  # Legacy fields kept during migration (APP-PROFILE-SCHEMA-004); the unified
  # engine dispatches from databases[]/volumes[], never from db_type/db_name.
  db_type: postgres
  db_name: chatwoot
  databases:
    # Declared DB intent (APP-PROFILE-SCHEMA-004-03): name + least-privilege
    # backup user only. The password lives in SOPS as
    # backup_db_chatwoot_password and MUST never appear in this profile (CRED-001).
    - db_name: chatwoot
      user: backup_chatwoot
  volumes:
    # Tier2 opt-in volume (APP-PROFILE-SCHEMA-004-04). The engine resolves the
    # real Docker volume at runtime by mount_path (D5); Compose prefixes the
    # declared name at runtime (chatwoot_chatwoot_storage). Uploads are
    # append-only, so a live tarball is crash-consistent (the DB dump is the
    # authoritative metadata source).
    - name: chatwoot_storage
      mount_path: /app/storage
      consistency: live
