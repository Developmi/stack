---
# n8n - Workflow automation platform (L5)
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/healthz"
  health_port: 5678
  scrape_port: 5678

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier1

backup:
  method: pg_dump
  schedule: "*-*-* 00/4:00:00"
  retention_daily: 7
  retention_weekly: 4
  retention_monthly: 12
  verification: monthly-restore-test
  # Legacy fields retained on purpose (APP-PROFILE-SCHEMA-004-01 requires
  # db_type/db_name present); the unified engine dispatches from
  # databases[]/volumes[], never from db_type/db_name.
  db_type: postgres
  db_name: n8n
  databases:
    # Declared DB intent (APP-PROFILE-SCHEMA-004-03). Password from SOPS
    # (backup_db_n8n_password); never declared here (CRED-001).
    - db_name: n8n
      user: backup_n8n
  volumes:
    # Tier2 opt-in external volume (APP-PROFILE-SCHEMA-004-04, ENGINE-003): the
    # compose file declares `n8n_data` external with a literal name, so the
    # engine resolves the literal volume `n8n_data` at runtime by mount_path
    # (D5). Holds the encryption key and local state, so it is quiesced (D12).
    - name: n8n_data
      mount_path: /home/node/.n8n
      consistency: quiesce
