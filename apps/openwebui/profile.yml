---
# OpenWebUI - Self-hosted AI interface (L5)
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/health"
  health_port: 8080
  scrape_port: 8080

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier2

backup:
  method: pg_dump
  schedule: "*-*-* 02:30:00"
  retention_daily: 14
  retention_weekly: 8
  retention_monthly: 12
  verification: quarterly-restore-test
  # Legacy fields kept during migration (APP-PROFILE-SCHEMA-004); the unified
  # engine dispatches from databases[]/volumes[], never from db_type/db_name.
  db_type: postgres
  db_name: openwebui
  databases:
    # Declared DB intent (APP-PROFILE-SCHEMA-004-03). Password from SOPS
    # (backup_db_openwebui_password); never declared here (CRED-001).
    - db_name: openwebui
      user: backup_openwebui
  volumes:
    # Tier2 opt-in volume (APP-PROFILE-SCHEMA-004-04). Resolved at runtime by
    # mount_path (D5): openwebui_openwebui_data. Holds the SQLite metadata DB
    # and the vector store, so it is quiesced for a consistent tarball (D12).
    - name: openwebui_data
      mount_path: /app/backend/data
      consistency: quiesce
