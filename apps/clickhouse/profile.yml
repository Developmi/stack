---
# Clickhouse - Analytics database server (L5)
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/ping"
  health_port: 8123
  scrape_port: 8123

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier2

backup:
  method: clickhouse-backup
  schedule: "*-*-* 02:30:00"
  retention_daily: 14
  retention_weekly: 8
  retention_monthly: 12
  verification: quarterly-restore-test
  # Legacy fields kept during migration (APP-PROFILE-SCHEMA-004); the unified
  # engine dispatches from databases[]/volumes[], never from db_type/db_name.
  db_type: clickhouse
  db_name: clickhouse
  databases:
    # Declared DB intent (APP-PROFILE-SCHEMA-004-03). The engine adapter (task
    # 4.7 / design Open Q2) uses `clickhouse-backup` when the binary is present
    # in the container and otherwise falls back to `clickhouse-client BACKUP`;
    # both stream the archive into restic (ENGINE-005). The adapter runs inside
    # the container, so no host-side password is declared here (CRED-001).
    - db_name: clickhouse
      user: backup_clickhouse
