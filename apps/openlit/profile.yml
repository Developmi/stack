---
# OpenLit - LLM observability platform (L5)
# Tier3: best-effort; file-volume backup declared, execution is future work.
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/"
  health_port: 3000
  scrape_port: 3000

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier3

backup:
  method: file-volume
  schedule: "Sun *-*-* 03:00:00"
  retention_daily: 0
  retention_weekly: 4
  retention_monthly: 6
  verification: none
  # Legacy fields kept during migration (APP-PROFILE-SCHEMA-004). Tier3
  # best-effort (D14/TIER-004): `db_type: none` means the engine deploys no
  # unit for openlit, so the volume below documents intent only until Tier3
  # execution lands.
  db_type: none
  db_name: ""
  volumes:
    # Declared Tier2 volume (APP-PROFILE-SCHEMA-004-04). Resolved at runtime by
    # mount_path (D5) if/when Tier3 execution is enabled.
    - name: openlit-data
      mount_path: /app/client/data
      consistency: quiesce
