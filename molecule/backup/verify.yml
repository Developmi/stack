---
# Verify: backup-profile-integration + unified engine (SDD)
# Proves the unified engine deploys dir-derived unit pairs against
# reduced-schema profiles (no `name` field), preserves skip semantics for
# db_type none/custom, rejects shell-metacharacter profile paths before render,
# asserts the rendered runner is executable (0755), and proves the runtime
# resolution contract with a stubbed docker: absent container -> exit 0, volume
# mount_path mismatch -> skip+log (D5/D6, ENGINE-003/004).
- name: Verify Backup Profile Integration (BPI) + Unified Engine
  hosts: all
  gather_facts: true
  vars:
    fixture_root: "{{ playbook_dir }}/fixtures/apps"
    threat_profile: "{{ playbook_dir }}/fixtures/threat/bad;name/profile.yml"
    role_tasks_dir: "{{ playbook_dir }}/../../roles/L6_runtime/backup/tasks"
    # NOT /tmp: the Molecule platform mounts /tmp as a noexec tmpfs, so the
    # executable docker/restic stubs must live on an exec-capable filesystem.
    shim_dir: /usr/local/lib/engine-shims
    enable_backups: true
    backup_r2_account_id: "molecule-test-account"
    vault_backup_r2_access_key_id: "molecule-test-access-key"
    vault_backup_r2_secret_access_key: "molecule-test-secret-key" # pragma: allowlist secret
    backup_r2_endpoint: "https://molecule-test.example.com"
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
  tasks:
    # ---------------------------------------------------------------------------
    # GIVEN: the fixture profiles (control node) mirroring apps/*/profile.yml
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enumerate fixture profiles on the control node"
      ansible.builtin.find:
        paths: "{{ fixture_root }}"
        patterns: "profile.yml"
        recurse: true
      delegate_to: localhost
      # controller-side: never escalate on the control node (see ansible.cfg become=True)
      become: false
      register: fixture_files

    - name: "GIVEN: Load backup metadata from each fixture profile"
      ansible.builtin.include_vars:
        file: "{{ item.path }}"
        name: _fixture
      loop: "{{ fixture_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: loaded_fixtures

    # ---------------------------------------------------------------------------
    # THEN: expected units derive from app DIRECTORY names (BPI-001-01/-02)
    # ---------------------------------------------------------------------------
    - name: "THEN: Collect dump-able apps (db_type not none/custom)"
      ansible.builtin.set_fact:
        _expected_apps: "{{ _expected_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') not in ['none', 'custom']

    - name: "THEN: Collect skip apps (db_type none/custom) - BPI-003-02"
      ansible.builtin.set_fact:
        _skip_apps: "{{ _skip_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') in ['none', 'custom']

    - name: "THEN: Guard - derivation produced a sane partition"
      ansible.builtin.assert:
        that:
          - _expected_apps | length >= 8
          - _skip_apps | length >= 1
        fail_msg: "Unexpected derivation: expected={{ _expected_apps | length }} skip={{ _skip_apps | length }}"
        success_msg: "Derived {{ _expected_apps | length }} dump-able apps and {{ _skip_apps | length }} skip apps from {{ fixture_files.files | length }} fixtures"

    # ---------------------------------------------------------------------------
    # THEN: engine timer + service units exist for every dump-able app (BPI-004-01)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat expected engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: expected_timer_stats

    - name: "THEN: Every dump-able app has a dir-derived engine timer unit"
      ansible.builtin.assert:
        that:
          - expected_timer_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine timer units: {{ expected_timer_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine timer units exist"

    - name: "GIVEN: Stat expected engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _expected_apps | sort }}"
      register: expected_service_stats

    - name: "THEN: Every dump-able app has a dir-derived engine service unit"
      ansible.builtin.assert:
        that:
          - expected_service_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine service units: {{ expected_service_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine service units exist"

    - name: "THEN: No retired backup-db-* unit remains on disk (ENGINE-001)"
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "backup-db-*"
      register: legacy_units

    - name: "THEN: Assert the retired backup-db-* prefix is gone"
      ansible.builtin.assert:
        that:
          - legacy_units.matched == 0
        fail_msg: "Retired backup-db-* units still present: {{ legacy_units.files | map(attribute='path') | list }}"
        success_msg: "No backup-db-* units on disk - engine naming only"

    - name: "GIVEN: Stat skip-app engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _skip_apps | sort }}"
      register: skip_timer_stats

    - name: "GIVEN: Stat skip-app engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _skip_apps | sort }}"
      register: skip_service_stats

    - name: "THEN: Skip apps have NO units and no error was raised (BPI-003-02)"
      ansible.builtin.assert:
        that:
          - skip_timer_stats.results | map(attribute='stat.exists') | list | max == false
          - skip_service_stats.results | map(attribute='stat.exists') | list | max == false
        fail_msg: "Units deployed for skip apps (none/custom) - expected no units"
        success_msg: "No units deployed for db_type none/custom apps ({{ _skip_apps | join(', ') }})"

    # ---------------------------------------------------------------------------
    # THEN: rendered units are internally consistent (BPI-002-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp rendered engine timer units"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: timer_contents

    - name: "THEN: Every engine timer Requires= references its own unit name (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - item.content | b64decode | regex_search('Requires=backup-engine-' ~ item.item ~ '\.service') is not none
        fail_msg: "Timer backup-engine-{{ item.item }}.timer does not Require= its matching service"
        success_msg: "Timer backup-engine-{{ item.item }}.timer Requires= backup-engine-{{ item.item }}.service"
      loop: "{{ timer_contents.results }}"

    # ---------------------------------------------------------------------------
    # THEN: templates render the derived name everywhere (BPI-002-01/-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp the chatwoot timer unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.timer"
      register: chatwoot_timer

    - name: "GIVEN: Slurp the chatwoot service unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.service"
      register: chatwoot_service

    - name: "THEN: chatwoot timer renders Description and Requires from the derived name (BPI-002-01)"
      ansible.builtin.assert:
        that:
          - chatwoot_timer.content | b64decode | regex_search('^Description=Backup timer for chatwoot$', multiline=True) is not none
          - chatwoot_timer.content | b64decode | regex_search('^Requires=backup-engine-chatwoot\.service$', multiline=True) is not none
        fail_msg: "chatwoot engine timer did not render the derived name"
        success_msg: "chatwoot engine timer renders the derived name in Description and Requires"

    - name: "THEN: chatwoot service invokes the unified engine, never aws s3 cp (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - chatwoot_service.content | b64decode | regex_search('^Description=Unified backup engine for chatwoot$', multiline=True) is not none
          - chatwoot_service.content | b64decode | regex_search('^ExecStart=/usr/local/bin/backup-engine-chatwoot\.sh$', multiline=True) is not none
          - chatwoot_service.content | b64decode is not search('aws s3 cp')
        fail_msg: "chatwoot engine service did not render the engine invocation"
        success_msg: "chatwoot engine service invokes the unified engine and never aws s3 cp"

    # ---------------------------------------------------------------------------
    # THEN: legacy profile with a `name` field stays deterministic (BPI-004-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the legacy dir-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-app.timer"
      register: legacy_dir_unit

    - name: "GIVEN: Stat the legacy name-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-name.timer"
      register: legacy_name_unit

    - name: "THEN: Directory-derived name takes precedence over the stale name field (BPI-004-02)"
      ansible.builtin.assert:
        that:
          - legacy_dir_unit.stat.exists
          - not legacy_name_unit.stat.exists
        fail_msg: "Legacy profile unit naming is not deterministic (dir-derived name must win)"
        success_msg: "Legacy profile deploys backup-engine-legacy-app.timer; stale name field ignored"

    # ---------------------------------------------------------------------------
    # THREAT: executable-file - rendered runner is fixed 0755 (task 2.2)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the rendered chatwoot engine runner (threat executable-file)"
      ansible.builtin.stat:
        path: /usr/local/bin/backup-engine-chatwoot.sh
      register: chatwoot_runner

    - name: "THEN: The rendered engine runner exists with fixed mode 0755"
      ansible.builtin.assert:
        that:
          - chatwoot_runner.stat.exists
          - chatwoot_runner.stat.mode == '0755'
          - chatwoot_runner.stat.pw_name == 'root'
        fail_msg: "backup-engine-chatwoot.sh must exist as 0755 root (got mode={{ chatwoot_runner.stat.mode | default('absent') }})"
        success_msg: "backup-engine-chatwoot.sh is 0755 root"

    # ---------------------------------------------------------------------------
    # STORAGE-003 / D7: /etc/restic/env MUST exist on every backup host
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the restic environment file (STORAGE-003)"
      ansible.builtin.stat:
        path: /etc/restic/env
      register: restic_env_file
      when: enable_backups | default(false) | bool

    - name: "THEN: /etc/restic/env is present, root-owned and 0600 on every backup host (STORAGE-003)"
      ansible.builtin.assert:
        that:
          - restic_env_file.stat.exists
          - restic_env_file.stat.pw_name == 'root'
          - restic_env_file.stat.mode == '0600'
        fail_msg: >-
          /etc/restic/env is missing or has wrong ownership/mode on
          {{ inventory_hostname }}. Every enable_backups: true host must ship
          the restic environment file (D7/STORAGE-003).
        success_msg: "/etc/restic/env present, root-owned and 0600 on {{ inventory_hostname }}"
      when: enable_backups | default(false) | bool

    # ---------------------------------------------------------------------------
    # RUNTIME RESOLUTION (tasks 2.1): stub docker + restic, run the REAL runner.
    #   absent container -> exit 0 (ENGINE-004/D6)
    #   volume mount_path mismatch -> skip + log (ENGINE-003/D5)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Create the stub bin directory"
      ansible.builtin.file:
        path: "{{ shim_dir }}"
        state: directory
        mode: "0755"

    - name: "GIVEN: Write the docker stub (container-present marker gate)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/docker"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Stub docker: with the marker present the container is 'running' and
          # exposes a volume at /app/storage (NOT chatwoot's declared /app/data).
          if [ -f "{{ shim_dir }}/container-present" ]; then
            case "$1" in
              inspect) printf 'stubvol /app/storage\n'; exit 0 ;;
              *) exit 0 ;;
            esac
          fi
          exit 1

    - name: "GIVEN: Write the restic stub (records invocations, drains stdin)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/restic"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          printf 'restic %s\n' "$*" >> "{{ shim_dir }}/restic.log"
          cat >/dev/null || true
          exit 0

    - name: "GIVEN: Ensure the absent-container marker is removed"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: absent

    - name: "WHEN: Run the engine runner with the container ABSENT"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_absent_run
      changed_when: false
      failed_when: false

    - name: "THEN: Absent container exits 0 and logs the skip (ENGINE-004/D6)"
      ansible.builtin.assert:
        that:
          - engine_absent_run.rc == 0
          - "'absent' in (engine_absent_run.stderr | default(''))"
        fail_msg: "Runner did not skip cleanly on an absent container (rc={{ engine_absent_run.rc }})"
        success_msg: "Absent container -> exit 0 with skip log"

    - name: "GIVEN: Mark the container present and reset the restic log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    - name: "GIVEN: Remove any previous restic stub log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the engine runner with a mount_path MISMATCH"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_mismatch_run
      changed_when: false
      failed_when: false

    - name: "THEN: Volume mismatch is skipped and logged, run still exits 0 (ENGINE-003/D5)"
      ansible.builtin.assert:
        that:
          - engine_mismatch_run.rc == 0
          - "'no volume mounted at' in (engine_mismatch_run.stderr | default(''))"
          - "'/app/data' in (engine_mismatch_run.stderr | default(''))"
        fail_msg: "Runner did not skip+log an unmatched mount_path (rc={{ engine_mismatch_run.rc }})"
        success_msg: "Unmatched mount_path -> skip+log, run continues"

    - name: "THEN: The declared DB was still dumped and streamed to restic"
      ansible.builtin.command:
        cmd: "grep -c 'backup --stdin' {{ shim_dir }}/restic.log"
      register: restic_invocations
      changed_when: false
      failed_when: false

    - name: "THEN: Assert the DB dump reached restic after the volume skip"
      ansible.builtin.assert:
        that:
          - restic_invocations.stdout | int >= 1
        fail_msg: "The DB dump did not reach restic after the volume skip"
        success_msg: "DB dump streamed to restic ({{ restic_invocations.stdout }} invocation(s))"

    # ---------------------------------------------------------------------------
    # THREAT MATRIX: shell metacharacters in profile paths fail before render
    # ---------------------------------------------------------------------------
    # The included task file (deploy_from_profile.yml) runs the REAL role logic:
    # include_vars succeeds (valid YAML), the derived name 'bad;name' fails the
    # ^[a-z0-9_-]+$ assert, and the template tasks never execute. Failure of the
    # block + absence of any unit proves fail-safe behavior.
    - name: "THREAT: Metacharacter profile path fails safely before render"
      block:
        - name: "WHEN: The role processes a profile path containing shell metacharacters"
          ansible.builtin.include_tasks: "{{ role_tasks_dir }}/deploy_from_profile.yml"
          loop:
            - "{{ threat_profile }}"
      rescue:
        - name: "THEN: The run failed (assert rejected the derived name)"
          ansible.builtin.assert:
            that:
              - 'threat_profile | dirname | basename is not match("^[a-z0-9_-]+$")'
            fail_msg: "Metachar app name unexpectedly passed the unit-name assert"
            success_msg: "Metachar app name 'bad;name' rejected by the unit-name assert"

        - name: "THEN: No unit was written for the metachar app"
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-engine-bad;name.timer"
          register: metachar_timer_unit

        - name: "THEN: Assert no metachar unit exists on disk"
          ansible.builtin.assert:
            that:
              - not metachar_timer_unit.stat.exists
            fail_msg: "A unit was deployed for a shell-metacharacter app name - FAIL"
            success_msg: "No unit deployed for shell-metacharacter app name"
