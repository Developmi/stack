---
# Verify: backup-profile-integration + unified engine (SDD)
# Proves the unified engine deploys dir-derived unit pairs against
# reduced-schema profiles (no `name` field), preserves skip semantics for
# db_type none/custom, rejects shell-metacharacter profile paths before render,
# asserts the rendered runner is executable (0755), and proves the runtime
# resolution contract with a stubbed docker: absent container -> exit 0, volume
# mount_path mismatch -> skip+log (D5/D6, ENGINE-003/004).
- name: Verify Backup Profile Integration (BPI) + Unified Engine
  hosts: all
  gather_facts: true
  vars:
    fixture_root: "{{ playbook_dir }}/fixtures/apps"
    threat_profile: "{{ playbook_dir }}/fixtures/threat/bad;name/profile.yml"
    role_tasks_dir: "{{ playbook_dir }}/../../roles/L6_runtime/backup/tasks"
    # NOT /tmp: the Molecule platform mounts /tmp as a noexec tmpfs, so the
    # executable docker/restic stubs must live on an exec-capable filesystem.
    shim_dir: /usr/local/lib/engine-shims
    enable_backups: true
    backup_r2_account_id: "molecule-test-account"
    vault_backup_r2_access_key_id: "molecule-test-access-key"
    vault_backup_r2_secret_access_key: "molecule-test-secret-key" # pragma: allowlist secret
    backup_r2_endpoint: "https://molecule-test.example.com"
    # Needed by the role's render path when the 004-05 threat test includes the
    # role directly (deploy_from_profile.yml renders the runner template).
    backup_provider: r2
    backup_repo_base_url: "s3:https://molecule-test.example.com/molecule-backups"
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
  tasks:
    # ---------------------------------------------------------------------------
    # GIVEN: the fixture profiles (control node) mirroring apps/*/profile.yml
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enumerate fixture profiles on the control node"
      ansible.builtin.find:
        paths: "{{ fixture_root }}"
        patterns: "profile.yml"
        recurse: true
      delegate_to: localhost
      # controller-side: never escalate on the control node (see ansible.cfg become=True)
      become: false
      register: fixture_files

    - name: "GIVEN: Load backup metadata from each fixture profile"
      ansible.builtin.include_vars:
        file: "{{ item.path }}"
        name: _fixture
      loop: "{{ fixture_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: loaded_fixtures

    # ---------------------------------------------------------------------------
    # THEN: expected units derive from app DIRECTORY names (BPI-001-01/-02)
    # ---------------------------------------------------------------------------
    - name: "THEN: Collect dump-able apps (db_type not none/custom)"
      ansible.builtin.set_fact:
        _expected_apps: "{{ _expected_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') not in ['none', 'custom']

    - name: "THEN: Collect skip apps (db_type none/custom) - BPI-003-02"
      ansible.builtin.set_fact:
        _skip_apps: "{{ _skip_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') in ['none', 'custom']

    - name: "THEN: Guard - derivation produced a sane partition"
      ansible.builtin.assert:
        that:
          - _expected_apps | length >= 8
          - _skip_apps | length >= 1
        fail_msg: "Unexpected derivation: expected={{ _expected_apps | length }} skip={{ _skip_apps | length }}"
        success_msg: "Derived {{ _expected_apps | length }} dump-able apps and {{ _skip_apps | length }} skip apps from {{ fixture_files.files | length }} fixtures"

    # ---------------------------------------------------------------------------
    # THEN: engine timer + service units exist for every dump-able app (BPI-004-01)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat expected engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: expected_timer_stats

    - name: "THEN: Every dump-able app has a dir-derived engine timer unit"
      ansible.builtin.assert:
        that:
          - expected_timer_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine timer units: {{ expected_timer_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine timer units exist"

    - name: "GIVEN: Stat expected engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _expected_apps | sort }}"
      register: expected_service_stats

    - name: "THEN: Every dump-able app has a dir-derived engine service unit"
      ansible.builtin.assert:
        that:
          - expected_service_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine service units: {{ expected_service_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine service units exist"

    - name: "THEN: No retired backup-db-* unit remains on disk (ENGINE-001)"
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "backup-db-*"
      register: legacy_units

    - name: "THEN: Assert the retired backup-db-* prefix is gone"
      ansible.builtin.assert:
        that:
          - legacy_units.matched == 0
        fail_msg: "Retired backup-db-* units still present: {{ legacy_units.files | map(attribute='path') | list }}"
        success_msg: "No backup-db-* units on disk - engine naming only"

    - name: "GIVEN: Stat skip-app engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _skip_apps | sort }}"
      register: skip_timer_stats

    - name: "GIVEN: Stat skip-app engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _skip_apps | sort }}"
      register: skip_service_stats

    - name: "THEN: Skip apps have NO units and no error was raised (BPI-003-02)"
      ansible.builtin.assert:
        that:
          - skip_timer_stats.results | map(attribute='stat.exists') | list | max == false
          - skip_service_stats.results | map(attribute='stat.exists') | list | max == false
        fail_msg: "Units deployed for skip apps (none/custom) - expected no units"
        success_msg: "No units deployed for db_type none/custom apps ({{ _skip_apps | join(', ') }})"

    # ---------------------------------------------------------------------------
    # THEN: rendered units are internally consistent (BPI-002-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp rendered engine timer units"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: timer_contents

    - name: "THEN: Every engine timer Requires= references its own unit name (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - item.content | b64decode | regex_search('Requires=backup-engine-' ~ item.item ~ '\.service') is not none
        fail_msg: "Timer backup-engine-{{ item.item }}.timer does not Require= its matching service"
        success_msg: "Timer backup-engine-{{ item.item }}.timer Requires= backup-engine-{{ item.item }}.service"
      loop: "{{ timer_contents.results }}"

    # ---------------------------------------------------------------------------
    # THEN: templates render the derived name everywhere (BPI-002-01/-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp the chatwoot timer unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.timer"
      register: chatwoot_timer

    - name: "GIVEN: Slurp the chatwoot service unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.service"
      register: chatwoot_service

    - name: "THEN: chatwoot timer renders Description and Requires from the derived name (BPI-002-01)"
      ansible.builtin.assert:
        that:
          - chatwoot_timer.content | b64decode | regex_search('^Description=Backup timer for chatwoot$', multiline=True) is not none
          - chatwoot_timer.content | b64decode | regex_search('^Requires=backup-engine-chatwoot\.service$', multiline=True) is not none
        fail_msg: "chatwoot engine timer did not render the derived name"
        success_msg: "chatwoot engine timer renders the derived name in Description and Requires"

    - name: "THEN: chatwoot service invokes the unified engine, never aws s3 cp (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - chatwoot_service.content | b64decode | regex_search('^Description=Unified backup engine for chatwoot$', multiline=True) is not none
          - chatwoot_service.content | b64decode | regex_search('^ExecStart=/usr/local/bin/backup-engine-chatwoot\.sh$', multiline=True) is not none
          - chatwoot_service.content | b64decode is not search('aws s3 cp')
        fail_msg: "chatwoot engine service did not render the engine invocation"
        success_msg: "chatwoot engine service invokes the unified engine and never aws s3 cp"

    # ---------------------------------------------------------------------------
    # THEN: legacy profile with a `name` field stays deterministic (BPI-004-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the legacy dir-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-app.timer"
      register: legacy_dir_unit

    - name: "GIVEN: Stat the legacy name-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-name.timer"
      register: legacy_name_unit

    - name: "THEN: Directory-derived name takes precedence over the stale name field (BPI-004-02)"
      ansible.builtin.assert:
        that:
          - legacy_dir_unit.stat.exists
          - not legacy_name_unit.stat.exists
        fail_msg: "Legacy profile unit naming is not deterministic (dir-derived name must win)"
        success_msg: "Legacy profile deploys backup-engine-legacy-app.timer; stale name field ignored"

    # ---------------------------------------------------------------------------
    # THREAT: executable-file - rendered runner is fixed 0755 (task 2.2)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the rendered chatwoot engine runner (threat executable-file)"
      ansible.builtin.stat:
        path: /usr/local/bin/backup-engine-chatwoot.sh
      register: chatwoot_runner

    - name: "THEN: The rendered engine runner exists with fixed mode 0755"
      ansible.builtin.assert:
        that:
          - chatwoot_runner.stat.exists
          - chatwoot_runner.stat.mode == '0755'
          - chatwoot_runner.stat.pw_name == 'root'
        fail_msg: "backup-engine-chatwoot.sh must exist as 0755 root (got mode={{ chatwoot_runner.stat.mode | default('absent') }})"
        success_msg: "backup-engine-chatwoot.sh is 0755 root"

    # ---------------------------------------------------------------------------
    # STORAGE-003 / D7: /etc/restic/env MUST exist on every backup host
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the restic environment file (STORAGE-003)"
      ansible.builtin.stat:
        path: /etc/restic/env
      register: restic_env_file
      when: enable_backups | default(false) | bool

    - name: "THEN: /etc/restic/env is present, root-owned and 0600 on every backup host (STORAGE-003)"
      ansible.builtin.assert:
        that:
          - restic_env_file.stat.exists
          - restic_env_file.stat.pw_name == 'root'
          - restic_env_file.stat.mode == '0600'
        fail_msg: >-
          /etc/restic/env is missing or has wrong ownership/mode on
          {{ inventory_hostname }}. Every enable_backups: true host must ship
          the restic environment file (D7/STORAGE-003).
        success_msg: "/etc/restic/env present, root-owned and 0600 on {{ inventory_hostname }}"
      when: enable_backups | default(false) | bool

    # ---------------------------------------------------------------------------
    # RUNTIME RESOLUTION (tasks 2.1): stub docker + restic, run the REAL runner.
    #   absent container -> exit 0 (ENGINE-004/D6)
    #   volume mount_path mismatch -> skip + log (ENGINE-003/D5)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Create the stub bin directory"
      ansible.builtin.file:
        path: "{{ shim_dir }}"
        state: directory
        mode: "0755"

    - name: "GIVEN: Write the docker stub (container-present marker gate)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/docker"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Stub docker for the engine tests. It records its argv (so the
          # credential-leak test can prove no secret reaches a command line) and
          # simulates: container presence, `docker ps` Tier1 discovery,
          # per-container mounts, pause/unpause tracking, and a failing
          # `docker run` (tar abort) when the tar-abort marker is present.
          log_dir="{{ shim_dir }}"
          printf 'docker %s\n' "$*" >> "$log_dir/docker.log"
          if [ ! -f "$log_dir/container-present" ]; then
            exit 1
          fi
          case "$1" in
            ps)
              if [ -f "$log_dir/tier1-containers" ]; then
                printf 'pg1 postgres:16\ncache1 redis:7-alpine\nch1 clickhouse/clickhouse-server:24.3\nweb nginx:latest\n'
              fi
              exit 0
              ;;
            inspect)
              case "$2" in
                chatwoot|chatwoot-db)
                  printf 'chatwoot_storage /app/storage\nundeclared_vol /secret/data\n' ;;
                quiesce-app|quiesce-app-db)
                  printf 'qvol /app/qdata\n' ;;
                *)
                  printf 'stubvol /app/storage\n' ;;
              esac
              exit 0
              ;;
            pause)
              printf 'pause %s\n' "$2" >> "$log_dir/quiesce.log"
              exit 0
              ;;
            unpause)
              printf 'unpause %s\n' "$2" >> "$log_dir/quiesce.log"
              exit 0
              ;;
            run)
              if [ -f "$log_dir/tar-abort" ]; then
                exit 1
              fi
              exit 0
              ;;
            exec)
              cat >/dev/null 2>&1 || true
              # ClickHouse adapter probe (task 4.7): report clickhouse-backup
              # ABSENT when the marker exists so the fallback path is exercised.
              case "$*" in
                *"command -v clickhouse-backup"*)
                  if [ -f "$log_dir/ch-no-binary" ]; then exit 1; else exit 0; fi
                  ;;
              esac
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac

    - name: "GIVEN: Write the restic stub (records invocations, drains stdin)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/restic"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          printf 'restic %s\n' "$*" >> "{{ shim_dir }}/restic.log"
          cat >/dev/null || true
          exit 0

    - name: "GIVEN: Ensure the absent-container marker is removed"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: absent

    - name: "WHEN: Run the engine runner with the container ABSENT"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_absent_run
      changed_when: false
      failed_when: false

    - name: "THEN: Absent container exits 0 and logs the skip (ENGINE-004/D6)"
      ansible.builtin.assert:
        that:
          - engine_absent_run.rc == 0
          - "'absent' in (engine_absent_run.stderr | default(''))"
        fail_msg: "Runner did not skip cleanly on an absent container (rc={{ engine_absent_run.rc }})"
        success_msg: "Absent container -> exit 0 with skip log"

    - name: "GIVEN: Mark the container present and reset the restic log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    - name: "GIVEN: Remove any previous restic stub log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the engine runner with a mount_path MISMATCH"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_mismatch_run
      changed_when: false
      failed_when: false

    - name: "THEN: Volume mismatch is skipped and logged, run still exits 0 (ENGINE-003/D5)"
      ansible.builtin.assert:
        that:
          - engine_mismatch_run.rc == 0
          - "'no volume mounted at' in (engine_mismatch_run.stderr | default(''))"
          - "'/app/data' in (engine_mismatch_run.stderr | default(''))"
        fail_msg: "Runner did not skip+log an unmatched mount_path (rc={{ engine_mismatch_run.rc }})"
        success_msg: "Unmatched mount_path -> skip+log, run continues"

    - name: "THEN: The declared DB was still dumped and streamed to restic"
      ansible.builtin.command:
        cmd: "grep -c 'backup --stdin' {{ shim_dir }}/restic.log"
      register: restic_invocations
      changed_when: false
      failed_when: false

    - name: "THEN: Assert the DB dump reached restic after the volume skip"
      ansible.builtin.assert:
        that:
          - restic_invocations.stdout | int >= 1
        fail_msg: "The DB dump did not reach restic after the volume skip"
        success_msg: "DB dump streamed to restic ({{ restic_invocations.stdout }} invocation(s))"

    # ---------------------------------------------------------------------------
    # THREAT MATRIX: shell metacharacters in profile paths fail before render
    # ---------------------------------------------------------------------------
    # The included task file (deploy_from_profile.yml) runs the REAL role logic:
    # include_vars succeeds (valid YAML), the derived name 'bad;name' fails the
    # ^[a-z0-9_-]+$ assert, and the template tasks never execute. Failure of the
    # block + absence of any unit proves fail-safe behavior.
    - name: "THREAT: Metacharacter profile path fails safely before render"
      block:
        - name: "WHEN: The role processes a profile path containing shell metacharacters"
          ansible.builtin.include_tasks: "{{ role_tasks_dir }}/deploy_from_profile.yml"
          loop:
            - "{{ threat_profile }}"
      rescue:
        - name: "THEN: The run failed (assert rejected the derived name)"
          ansible.builtin.assert:
            that:
              - 'threat_profile | dirname | basename is not match("^[a-z0-9_-]+$")'
            fail_msg: "Metachar app name unexpectedly passed the unit-name assert"
            success_msg: "Metachar app name 'bad;name' rejected by the unit-name assert"

        - name: "THEN: No unit was written for the metachar app"
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-engine-bad;name.timer"
          register: metachar_timer_unit

        - name: "THEN: Assert no metachar unit exists on disk"
          ansible.builtin.assert:
            that:
              - not metachar_timer_unit.stat.exists
            fail_msg: "A unit was deployed for a shell-metacharacter app name - FAIL"
            success_msg: "No unit deployed for shell-metacharacter app name"

    # ---------------------------------------------------------------------------
    # TIER-001 / D14 (task 3.1): Tier1 image-discovered database protection.
    # The engine deploys a host-level Tier1 runner that discovers postgres /
    # clickhouse / redis-valkey containers BY IMAGE (no app declaration) and
    # streams logical dumps to restic.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the Tier1 discovery runner (TIER-001)"
      ansible.builtin.stat:
        path: /usr/local/bin/backup-tier1.sh
      register: tier1_runner

    - name: "THEN: The Tier1 runner is deployed 0755 root (TIER-001)"
      ansible.builtin.assert:
        that:
          - tier1_runner.stat.exists
          - tier1_runner.stat.mode == '0755'
          - tier1_runner.stat.pw_name == 'root'
        fail_msg: "Tier1 discovery runner /usr/local/bin/backup-tier1.sh missing or wrong mode"
        success_msg: "Tier1 discovery runner deployed 0755 root"

    - name: "GIVEN: Mark Tier1 containers present"
      ansible.builtin.file:
        path: "{{ shim_dir }}/tier1-containers"
        state: touch
        mode: "0644"

    - name: "GIVEN: Reset the restic stub log for the Tier1 run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the Tier1 discovery runner"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-tier1.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier1_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier1 run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier1_restic_log
      changed_when: false
      failed_when: false

    - name: "THEN: Tier1 discovery dumps postgres + valkey by image and ignores others (TIER-001)"
      ansible.builtin.assert:
        that:
          - tier1_run.rc == 0
          - "'tier1,postgresql,pg1' in tier1_restic_log.stdout"
          - "'tier1,valkey,cache1' in tier1_restic_log.stdout"
          - "'nginx' not in tier1_restic_log.stdout"
        fail_msg: >-
          Tier1 image discovery did not protect the declared engine families
          (rc={{ tier1_run.rc }}). log={{ tier1_restic_log.stdout }}
        success_msg: "Tier1 discovery dumped postgres + valkey and ignored nginx"

    # ---------------------------------------------------------------------------
    # TIER-002 (task 3.2): only declared volumes[] are backed up; an undeclared
    # volume reported by docker inspect is never touched.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Reset the restic stub log for the Tier2 opt-in run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the chatwoot runner (declared mount mismatch + undeclared volume)"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier2_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier2 run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier2_restic_log
      changed_when: false
      failed_when: false

    - name: "THEN: Undeclared and unmatched volumes are never tarred (TIER-002)"
      ansible.builtin.assert:
        that:
          - tier2_run.rc == 0
          - "'volume,chatwoot' not in tier2_restic_log.stdout"
          - "'undeclared_vol' not in tier2_restic_log.stdout"
        fail_msg: >-
          The engine backed up a volume that was not declared with a matching
          mount_path (TIER-002). log={{ tier2_restic_log.stdout }}
        success_msg: "Only declared volumes are backed up; undeclared volume untouched"

    # ---------------------------------------------------------------------------
    # TIER-003 (task 3.3): a tar abort MUST still unpause the container.
    # RED before the quiesce-library fix: the EXIT trap could not read the
    # function-local `paused` flag under `set -u`, leaving the container paused.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enable the tar-abort marker"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/tar-abort"
        content: "abort\n"
        mode: "0644"

    - name: "GIVEN: Remove any previous quiesce log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/quiesce.log"
        state: absent

    - name: "WHEN: Run the quiesce-app runner and the volume tar aborts"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-quiesce-app.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: quiesce_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the quiesce log"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/quiesce.log"
      register: quiesce_log
      changed_when: false
      failed_when: false

    - name: "THEN: The container is unpaused after a tar abort (TIER-003)"
      ansible.builtin.assert:
        that:
          - "'pause quiesce-app' in quiesce_log.stdout"
          - "'unpause quiesce-app' in quiesce_log.stdout"
        fail_msg: >-
          Container left PAUSED after the tar step aborted (TIER-003 violated).
          quiesce.log={{ quiesce_log.stdout }}
        success_msg: "Container unpaused after tar abort (TIER-003 satisfied)"

    - name: "GIVEN: Remove the tar-abort marker"
      ansible.builtin.file:
        path: "{{ shim_dir }}/tar-abort"
        state: absent

    # ---------------------------------------------------------------------------
    # CRED-003 (task 3.4): per-app DB EnvironmentFile, 0600 root.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the rendered per-app DB credential file"
      ansible.builtin.stat:
        path: /etc/restic/db-chatwoot.env
      register: db_cred_file

    - name: "THEN: The per-app DB credential file is root-owned 0600 (CRED-003)"
      ansible.builtin.assert:
        that:
          - db_cred_file.stat.exists
          - db_cred_file.stat.pw_name == 'root'
          - db_cred_file.stat.mode == '0600'
        fail_msg: "/etc/restic/db-chatwoot.env missing or wrong ownership/mode (CRED-003)"
        success_msg: "/etc/restic/db-chatwoot.env is root-owned 0600"

    - name: "GIVEN: Read the rendered DB credential file"
      ansible.builtin.slurp:
        path: /etc/restic/db-chatwoot.env
      register: db_cred_content

    - name: "THEN: The credential file exports PGPASSWORD from SOPS (CRED-003)"
      ansible.builtin.assert:
        that:
          - "'PGPASSWORD=' in (db_cred_content.content | b64decode)"
        fail_msg: "Rendered DB credential file does not export PGPASSWORD"
        success_msg: "DB credential file exports PGPASSWORD"

    # ---------------------------------------------------------------------------
    # CRED-003/004 (task 3.5): the password never reaches a command line or
    # `docker inspect` output, nor the rendered runner itself.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Reset the docker argv log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/docker.log"
        state: absent

    - name: "WHEN: Run the chatwoot runner with the sentinel password set"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: leak_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the docker argv log"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/docker.log"
      register: docker_argv_log
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the rendered chatwoot runner"
      ansible.builtin.slurp:
        path: /usr/local/bin/backup-engine-chatwoot.sh
      register: chatwoot_runner_content

    - name: "THEN: The sentinel password never appears in any docker argv or the runner (CRED-003)"
      ansible.builtin.assert:
        that:
          - "'LEAKCANARY_chatwoot_pw' not in docker_argv_log.stdout"
          - "'LEAKCANARY_chatwoot_pw' not in (chatwoot_runner_content.content | b64decode)"
        fail_msg: >-
          The DB password leaked onto a docker command line or into the rendered
          runner (CRED-003). argv={{ docker_argv_log.stdout }}
        success_msg: "No password on any docker command line or in the runner"

    - name: "WHEN: Inspect the container with docker inspect"
      ansible.builtin.command:
        cmd: docker inspect chatwoot
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: docker_inspect_out
      changed_when: false
      failed_when: false

    - name: "THEN: docker inspect output carries no password (CRED-004)"
      ansible.builtin.assert:
        that:
          - "'LEAKCANARY_chatwoot_pw' not in (docker_inspect_out.stdout | default(''))"
        fail_msg: "The DB password appeared in docker inspect output (CRED-004)"
        success_msg: "docker inspect output carries no password"

    # ---------------------------------------------------------------------------
    # CRED-005 (task 3.6): no secret is passed with `-e NAME="value"` on any
    # ephemeral-container command line.
    # ---------------------------------------------------------------------------
    - name: "THEN: Assert no -e secret on the retention/backup command lines (CRED-005)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e RESTIC_PASSWORD="')
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e AWS_SECRET_ACCESS_KEY="')
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e AWS_ACCESS_KEY_ID="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e RESTIC_PASSWORD="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e AWS_SECRET_ACCESS_KEY="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e AWS_ACCESS_KEY_ID="')
        fail_msg: "A backup password is still passed via -e on a command line (CRED-005)"
        success_msg: "No secret passed via -e on any command line (CRED-005)"

    # ---------------------------------------------------------------------------
    # ClickHouse adapter (task 4.7 / design Open Q2): when `clickhouse-backup`
    # is absent, the engine MUST fall back to `clickhouse-client BACKUP` and
    # still stream the archive into restic (ENGINE-005).
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Mark clickhouse-backup ABSENT in the stub container"
      ansible.builtin.file:
        path: "{{ shim_dir }}/ch-no-binary"
        state: touch
        mode: "0644"

    - name: "GIVEN: Reset the restic stub log for the ClickHouse fallback run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the clickhouse engine runner with clickhouse-backup absent"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-clickhouse.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: ch_fallback_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the ClickHouse run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: ch_fallback_log
      changed_when: false
      failed_when: false

    - name: "THEN: The clickhouse-client BACKUP fallback streamed into restic (4.7)"
      ansible.builtin.assert:
        that:
          - ch_fallback_run.rc == 0
          - "'clickhouse-client BACKUP' in (ch_fallback_run.stderr | default(''))"
          - "'db,clickhouse,clickhouse' in ch_fallback_log.stdout"
        fail_msg: >-
          ClickHouse adapter did not fall back to clickhouse-client BACKUP and
          stream to restic (rc={{ ch_fallback_run.rc }}).
          log={{ ch_fallback_log.stdout }}
        success_msg: "ClickHouse fell back to clickhouse-client BACKUP and streamed to restic"

    - name: "GIVEN: Remove the clickhouse-backup-absent marker"
      ansible.builtin.file:
        path: "{{ shim_dir }}/ch-no-binary"
        state: absent

    # ---------------------------------------------------------------------------
    # APP-PROFILE-SCHEMA-004 (tasks 4.1-4.8): the SHIPPED apps/*/profile.yml
    # declarations. Molecule converges fixtures, so this section reads the real
    # profiles from the control node and validates the shipped schema directly:
    # databases[] requires db_name + user and no password (004-03); volumes[]
    # requires name + mount_path + consistency in {quiesce, live} (004-04).
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enumerate the shipped app profiles (004)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../apps"
        patterns: "profile.yml"
        recurse: true
      delegate_to: localhost
      become: false
      register: real_profile_files

    - name: "GIVEN: Load each shipped app profile (004)"
      ansible.builtin.include_vars:
        file: "{{ item.path }}"
        name: _real
      loop: "{{ real_profile_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: real_profiles

    - name: "THEN: Shipped profiles satisfy the 004 schema contract (004-03/-04)"
      ansible.builtin.assert:
        that:
          - (p.backup.databases | default([])) | selectattr('db_name', 'undefined') | list | length == 0
          - (p.backup.databases | default([])) | selectattr('user', 'undefined') | list | length == 0
          - (p.backup.databases | default([])) | selectattr('password', 'defined') | list | length == 0
          - (p.backup.volumes | default([])) | selectattr('name', 'undefined') | list | length == 0
          - (p.backup.volumes | default([])) | selectattr('mount_path', 'undefined') | list | length == 0
          - (p.backup.volumes | default([])) | rejectattr('consistency', 'in', ['quiesce', 'live']) | list | length == 0
        fail_msg: >-
          Shipped profile '{{ item.item.path | dirname | basename }}' violates
          APP-PROFILE-SCHEMA-004: databases[] requires db_name + user with no
          password; volumes[] requires name + mount_path + consistency in
          {quiesce, live}.
        success_msg: "Shipped profile '{{ item.item.path | dirname | basename }}' satisfies APP-PROFILE-SCHEMA-004"
      loop: "{{ real_profiles.results }}"
      loop_control:
        label: "{{ item.item.path | dirname | basename }}"
      vars:
        p: "{{ item.ansible_facts._real }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._real is defined
        - item.ansible_facts._real.backup is defined

    - name: "GIVEN: Load the shipped n8n / uptime-kuma / openlit / chatwoot profiles (004)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../apps/{{ item.app }}/profile.yml"
        name: "{{ item.var }}"
      loop:
        - { app: n8n, var: real_n8n }
        - { app: uptime-kuma, var: real_uptime_kuma }
        - { app: openlit, var: real_openlit }
        - { app: chatwoot, var: real_chatwoot }
      loop_control:
        label: "{{ item.app }}"

    - name: "THEN: n8n backup block matches the dump-based theme (004-01)"
      ansible.builtin.assert:
        that:
          - real_n8n.backup.method == 'pg_dump'
          - real_n8n.backup.schedule == '*-*-* 00/4:00:00'
          - real_n8n.backup.retention_daily == 7
          - real_n8n.backup.retention_weekly == 4
          - real_n8n.backup.retention_monthly == 12
          - real_n8n.backup.verification == 'monthly-restore-test'
          - real_n8n.backup.db_type is defined
          - real_n8n.backup.db_name is defined
          - real_n8n.backup.volumes | map(attribute='name') | list == ['n8n_data']
          - real_n8n.backup.volumes | map(attribute='mount_path') | list == ['/home/node/.n8n']
        fail_msg: "n8n profile does not match APP-PROFILE-SCHEMA-004-01"
        success_msg: "n8n declares pg_dump + retention + db_type/db_name + n8n_data volume (004-01)"

    - name: "THEN: uptime-kuma and openlit are file-volume with tier-appropriate verification (004-02)"
      ansible.builtin.assert:
        that:
          - real_uptime_kuma.backup.method == 'file-volume'
          - real_uptime_kuma.backup.verification == 'quarterly-restore-test'
          - real_openlit.backup.method == 'file-volume'
          - real_openlit.backup.verification == 'none'
        fail_msg: "uptime-kuma/openlit do not match APP-PROFILE-SCHEMA-004-02"
        success_msg: "uptime-kuma quarterly / openlit none, both file-volume (004-02)"

    - name: "THEN: chatwoot declares a password-free database entry (004-03)"
      ansible.builtin.assert:
        that:
          - real_chatwoot.backup.databases | length == 1
          - real_chatwoot.backup.databases | map(attribute='db_name') | list == ['chatwoot']
          - real_chatwoot.backup.databases | map(attribute='user') | list | length == 1
          - real_chatwoot.backup.databases | selectattr('password', 'defined') | list | length == 0
        fail_msg: "chatwoot databases[] must declare db_name + user and no password (004-03)"
        success_msg: "chatwoot declares db_name chatwoot + backup user, no password (004-03)"

    - name: "THEN: chatwoot declares a well-formed volume entry (004-04)"
      ansible.builtin.assert:
        that:
          - real_chatwoot.backup.volumes | map(attribute='name') | list == ['chatwoot_storage']
          - real_chatwoot.backup.volumes | map(attribute='mount_path') | list == ['/app/storage']
          - real_chatwoot.backup.volumes | map(attribute='consistency') | list == ['live']
        fail_msg: "chatwoot volumes[] must declare name + mount_path + consistency (004-04)"
        success_msg: "chatwoot volume declares name/mount_path/consistency (004-04)"

    # ---------------------------------------------------------------------------
    # APP-PROFILE-SCHEMA-004-05: an invalid `consistency` MUST be rejected before
    # any unit render. RED before the validation gate: the profile is accepted and
    # a unit is written, so the explicit `fail` below trips and the rescue assert
    # (no unit on disk) fails. GREEN after the gate: the assert rejects the entry
    # and no unit exists.
    # ---------------------------------------------------------------------------
    - name: "THREAT: invalid volume consistency is rejected before render (004-05)"
      block:
        - name: "WHEN: The role processes a profile declaring consistency: eventual"
          ansible.builtin.include_role:
            name: L6_runtime/backup
            tasks_from: deploy_from_profile.yml
          loop:
            - "{{ playbook_dir }}/fixtures/threat/bad-consistency/profile.yml"

        - name: "THEN: An invalid consistency MUST have been rejected (004-05)"
          ansible.builtin.fail:
            msg: "consistency: eventual was accepted - APP-PROFILE-SCHEMA-004-05 violated"
      rescue:
        - name: "THEN: Stat the unit for the invalid-consistency profile"
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-engine-bad-consistency.timer"
          register: bad_consistency_timer

        - name: "THEN: Assert no invalid-consistency unit exists on disk (004-05)"
          ansible.builtin.assert:
            that:
              - not bad_consistency_timer.stat.exists
            fail_msg: "A unit was deployed despite consistency: eventual - 004-05 violated"
            success_msg: "consistency: eventual rejected before any unit render (004-05)"
