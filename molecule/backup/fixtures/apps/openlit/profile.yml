---
# OpenLit - LLM observability platform (L5)
# Tier3: best-effort; file-volume backup declared, execution is future work.
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/"
  health_port: 3000
  scrape_port: 3000

compliance_tags:
  - cis-docker:4.1
  - cis-docker:4.5
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - soc2:cc6.6
  - iso27001:a.8.2.3
  - iso27001:a.12.4.1

dr_tier: tier3

backup:
  method: file-volume
  schedule: "Sun *-*-* 03:00:00"
  retention_daily: 0
  retention_weekly: 4
  retention_monthly: 6
  verification: none
  db_type: none
  db_name: ""
