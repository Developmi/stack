---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian12-l4-networking
    image: geerlingguy/docker-debian12-ansible@sha256:0b96d8780359f0833bf2d81b5b26ede106beae09c7f22b19a7abeef54770551f
    pre_build_image: true
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cgroupns_mode: host
    privileged: true
    groups:
      - brain
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible
  env:
    ANSIBLE_BECOME_PROMPT_FLAG: ""
    ANSIBLE_REMOTE_TMP: /tmp/.ansible
verifier:
  name: ansible
