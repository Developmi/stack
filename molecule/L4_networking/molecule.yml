---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian12-l4-networking
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cgroupns_mode: host
    privileged: true
    groups:
      - brain
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible
  env:
    ANSIBLE_BECOME_PROMPT_FLAG: ""
    ANSIBLE_REMOTE_TMP: /tmp/.ansible
verifier:
  name: ansible
